name: pre-commit
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'


jobs:
  pre-commit:
    if: github.event_name != 'schedule' || github.repository == 'deepqmc/deepqmc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files
