name: Pyright
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'


jobs:
  pyright:
    if: github.event_name != 'schedule' || github.repository == 'deepqmc/deepqmc'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run pyright
        run: pyright
