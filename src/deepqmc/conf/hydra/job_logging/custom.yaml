defaults:
  - default
formatters:
  simple:
    format: '[%(asctime)s.%(msecs)03.0f] %(levelname)s:%(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
    style: '%'
handlers:
  console:
    stream: ext://deepqmc.app.TqdmStream
  file:
    filename: ${hydra.runtime.output_dir}/${hydra.job.name}${process_idx_suffix:}.log
