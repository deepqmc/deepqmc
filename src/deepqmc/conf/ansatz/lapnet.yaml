_target_: deepqmc.wf.NeuralNetworkWaveFunction
_partial_: true
envelope:
  _target_: deepqmc.wf.env.ExponentialEnvelopes
  _partial_: true
  isotropic: true
  per_shell: false
  per_orbital_exponent: true
  spin_restricted: false
  init_to_ones: true
  softplus_zeta: false
backflow_op:
  _target_: deepqmc.wf.nn_wave_function.BackflowOp
  _partial_: true
  mult_act: '${eval:"lambda x: x"}'
n_determinants: 16
full_determinant: true
cusp_electrons:
  _target_: deepqmc.wf.cusp.ElectronicCuspAsymptotic
  _partial_: true
  same_scale: 0.25
  anti_scale: 0.5
  alpha: 1.0
  trainable_alpha: true
  cusp_function:
    _target_: deepqmc.wf.cusp.PsiformerCusp
cusp_nuclei: false
backflow_transform: mult
conf_coeff:
  _target_: deepqmc.hkext.SumPool
  _partial_: true
omni_factory:
  _target_: deepqmc.wf.omni.OmniNet
  _partial_: true
  embedding_dim: 256 # todo
  jastrow_factory: null
  backflow_factory:
    _target_: deepqmc.wf.omni.Backflow
    _partial_: true
    subnet_factory:
      _target_: deepqmc.hkext.MLP
      _partial_: true
      hidden_layers: ['log', 1]
      bias: true # changed from false
      last_linear: true
      activation: null
      init: ferminet
  nuclear_gnn_head: null
  gnn_factory:
    _target_: deepqmc.gnn.ElectronGNN
    _partial_: true
    n_interactions: 4
    nuclei_embedding: null
    electron_embedding:
      _target_: deepqmc.gnn.electron_gnn.ElectronEmbedding
      _partial_: true
      positional_embeddings:
        ne:
          _target_: deepqmc.gnn.edge_features.CombinedEdgeFeature
          features:
          - _target_: deepqmc.gnn.edge_features.DistancePowerEdgeFeature
            powers: [1]
            log_rescale: true
          - _target_: deepqmc.gnn.edge_features.DifferenceEdgeFeature
            log_rescale: true
      use_spin: true
      project_to_embedding_dim: true
      use_individual_stream: true
    two_particle_stream_dim: 32 # not used, irrelevant
    self_interaction: true # todo
    edge_features: null # todo
    layer_factory: # todo
      _target_: deepqmc.gnn.electron_gnn.ElectronGNNLayer # todo
      _partial_: true # todo
      subnet_factory:
        _target_: deepqmc.hkext.Identity
        _partial_: true
      electron_residual: false # todo
      nucleus_residual: false # todo
      two_particle_residual: false
      deep_features: false
      update_rule: concatenate
      update_features:
      - _target_: deepqmc.gnn.update_features.SparseDerivativeNodeAttentionElectronUpdateFeature
        _partial_: true
        num_heads: 4
        indiv_mlp_factory:
          _target_: deepqmc.hkext.MLP
          _partial_: true # todo
          hidden_layers: ['log', 2] # todo
          bias: true # todo
          last_linear: false # todo
          activation: # todo
            _target_: jax.numpy.tanh # todo
            _partial_: true # todo
          init: ferminet # todo
        attn_mlp_factory:
          _target_: deepqmc.hkext.MLP
          _partial_: true
          hidden_layers: ['log', 2] # todo
          bias: true # todo
          last_linear: false
          activation:
            _target_: jax.numpy.tanh
            _partial_: true
          init: ferminet
        attention_residual: # todo
          _target_: deepqmc.hkext.ResidualConnection # todo
          normalize: false # todo
        attn_mlp_residual: # todo
          _target_: deepqmc.hkext.ResidualConnection # todo
          normalize: false # todo
