defaults:
  - sampler_factory: default
  - opt: kfac
_target_: deepqmc.app.train_from_factories
hamil: ${hamil}
ansatz: ${ansatz}
steps: 50000
molecule_batch_size: ???
electron_batch_size: 2048
electronic_states: 1
seed: 0
pretrain_steps: 0
max_restarts: 5
loss_function_factory:
  _target_: deepqmc.loss.create_loss_fn
  _partial_: true
  clip_mask_fn:
    _target_: deepqmc.loss.median_clip_and_mask
    _partial_: true
    clip_width: 5
    median_center: true
mols:
  _target_: deepqmc.app.read_molecules
  directory: ???
observable_monitors:
  - local_energy
  - R
metric_logger_constructor:
  _target_: deepqmc.log.TensorboardMetricLogger
  _partial_: true
  max_queue: 10
chkpt_constructor:
  _target_: deepqmc.log.CheckpointStore
  _partial_: true
h5_logger_constructor:
  _target_: deepqmc.log.H5Logger
  _partial_: true
  keys_whitelist:
    - local_energy
    - mol_idxs
